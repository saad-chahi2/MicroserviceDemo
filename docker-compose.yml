# Lancer tout l'environnement local :   docker compose up --build -d
# Pré-requis : copier .env.example en .env (fournit MSSQL_SA_PASSWORD)
name: microservices-demo

services:
  sqlserverdb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Créer le fichier .env à partir de .env.example}
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    # "healthy" seulement quand SQL Server accepte réellement des requêtes.
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  customerservice:
    build:
      context: .
      dockerfile: src/CustomerService/Dockerfile
    image: saadchahi/customerservice:local
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserverdb;Database=CustomerDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
    depends_on:
      sqlserverdb:
        condition: service_healthy

  orderservice:
    build:
      context: .
      dockerfile: src/OrderService/Dockerfile
    image: saadchahi/orderservice:local
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserverdb;Database=OrderDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
    depends_on:
      sqlserverdb:
        condition: service_healthy

volumes:
  sql_data:
