version: '3.8'

services:
  sqlserverdb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserverdb
    environment:
      SA_PASSWORD: "sa@123456"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - microservices_network

  customerservice:
    build: 
      context: .
      dockerfile: ./CustomerService/Dockerfile
    container_name: customerservice
    ports:
      - "5002:5002"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserverdb;Database=MicroservicesDemo;User Id=sa;Password=sa@123456;TrustServerCertificate=True;
    depends_on:
      - sqlserverdb
    networks:
      - microservices_network

  orderservice:
    build: 
      context: .
      dockerfile: ./OrderService/Dockerfile
    container_name: orderservice
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserverdb;Database=MicroservicesDemo;User Id=sa;Password=sa@123456;TrustServerCertificate=True;
    depends_on:
      - sqlserverdb
    networks:
      - microservices_network

volumes:
  sql_data:

networks:
  microservices_network:
