name: CI
on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
jobs:
  build-and-test:
    name: Build & tests
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5
      - name: Installer .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restaurer les packages NuGet
        run: dotnet restore MicroservicesApp.slnx

      - name: Compiler
        run: dotnet build MicroservicesApp.slnx --configuration Release --no-restore

      - name: Lancer les tests
        run: dotnet test --solution MicroservicesApp.slnx --configuration Release --no-build
