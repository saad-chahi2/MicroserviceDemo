name: CI
on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
jobs:
  build-and-test:
    name: Build & tests
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5
      - name: Installer .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restaurer les packages NuGet
        run: dotnet restore MicroservicesApp.slnx

      - name: Compiler
        run: dotnet build MicroservicesApp.slnx --configuration Release --no-restore

      - name: Lancer les tests
        run: dotnet test --solution MicroservicesApp.slnx --configuration Release --no-build

  docker:
    name: Image ${{ matrix.image }}
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - project: CustomerService
            image: customerservice
          - project: OrderService
            image: orderservice
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/${{ matrix.project }}/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest

